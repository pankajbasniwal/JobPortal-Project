
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - JobPortal</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f3f5fb;
            color: #1e293b;
        }

        /* Navbar */
        nav {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }

        nav h2 {
            color: #4f46e5;
            font-size: 27px;
            font-weight: 800;
        }

        nav div {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #4f46e5;
        }

        /* Page Background */
        .page-container {
            min-height: 100vh;
            padding: 45px 20px;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        /* Registration Card */
        .register-container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 40px 45px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }

        /* Header */
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .form-header h1 {
            font-size: 30px;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #64748b;
            font-size: 15px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 9px;
        }

        input, textarea, select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dbe1ea;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            background: #fbfcff;
            color: #334155;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* Role Sections */
        .details-section {
            background: #f8faff;
            padding: 22px;
            border-radius: 12px;
            margin: 25px 0;
            border: 1px solid #e2e8f0;
        }

        .details-section h3 {
            color: #4f46e5;
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Button */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(79,70,229,0.3);
        }

        /* Message */
        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: 600;
        }

        /* Login Link */
        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .login-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 700;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .required {
            color: #ef4444;
        }

        /* Mobile */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .register-container {
                padding: 28px 20px;
            }

            .form-header h1 {
                font-size: 25px;
            }
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav>
        <h2>JobPortal</h2>

        <div>
            <a href="/">Home</a>
            <a href="/login/">Login</a>
        </div>
    </nav>

    <!-- Registration Page -->
    <div class="page-container">

        <div class="register-container">

            <!-- Header -->
            <div class="form-header">

                <div class="icon">👤</div>

                <h1>Create Account</h1>

                <p>Join JobPortal and start your journey.</p>

            </div>

            <form id="registerForm">

                <!-- Account Details -->
                <div class="form-group">

                    <label>Register As <span class="required">*</span></label>

                    <select id="role" required>

                        <option value="student">Student</option>

                        <option value="recruiter">Recruiter</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Username <span class="required">*</span></label>

                    <input type="text" id="username"
                        placeholder="Enter your username" required>

                </div>

                <div class="form-group">

                    <label>Email <span class="required">*</span></label>

                    <input type="email" id="email"
                        placeholder="Enter your email address" required>

                </div>

                <div class="form-group">

                    <label>Password <span class="required">*</span></label>

                    <input type="password" id="password"
                        placeholder="Minimum 8 characters"
                        minlength="8" required>

                </div>

                <!-- Student Details -->
                <div id="studentFields" class="details-section">

                    <h3>🎓 Student Details</h3>

                    <div class="form-group">

                        <label>Phone</label>

                        <input type="text" id="phone"
                            placeholder="Enter your phone number">

                    </div>

                    <div class="form-group">

                        <label>Education</label>

                        <input type="text" id="education"
                            placeholder="e.g. BSc Computer Science">

                    </div>

                    <div class="form-group">

                        <label>Skills</label>

                        <textarea id="skills"
                            placeholder="e.g. Python, Java, HTML, CSS, SQL"></textarea>

                    </div>

                </div>

                <!-- Recruiter Details -->
                <div id="recruiterFields"
                     class="details-section"
                     style="display:none;">

                    <h3>🏢 Company Details</h3>

                    <div class="form-group">

                        <label>Company Name</label>

                        <input type="text" id="company_name"
                            placeholder="Enter company name">

                    </div>

                    <div class="form-group">

                        <label>Description</label>

                        <textarea id="description"
                            placeholder="Describe your company"></textarea>

                    </div>

                    <div class="form-group">

                        <label>Website</label>

                        <input type="url" id="website"
                            placeholder="https://example.com">

                    </div>

                    <div class="form-group">

                        <label>Location</label>

                        <input type="text" id="location"
                            placeholder="e.g. Mumbai, Maharashtra">

                    </div>

                </div>

                <!-- Submit -->
                <button type="submit">
                    🚀 Create Account
                </button>

            </form>

            <p id="message"></p>

            <p class="login-text">
                Already have an account?
                <a href="/login/">Login here</a>
            </p>

        </div>

    </div>

    <script src="/static/js/register.js"></script>

</body>

</html>
