
<!DOCTYPE html>
<html>
<head>
    <title>Apply for Job - JobPortal</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav>
        <h2>JobPortal</h2>
        <div>
            <a href="/">Home</a>
            <a href="/jobs/">Jobs</a>
            <a href="/student-dashboard/">Dashboard</a>
        </div>
    </nav>

    <div class="register-container">

        <h1>Apply for Job</h1>

        <p>Upload your resume to apply for this opportunity.</p>

        <form id="applyForm" data-job-id="{{ job_id }}">

            <label>Select Resume (PDF)</label>

            <input
                type="file"
                id="resume"
                accept=".pdf,application/pdf"
                required
            >

            <button type="submit">Submit Application</button>

        </form>

        <p id="message"></p>

        <p>
            <a href="/jobs/">Back to Jobs</a>
        </p>

    </div>

    <script src="/static/js/apply.js"></script>

</body>
</html>
