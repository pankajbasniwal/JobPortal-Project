
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - JobPortal</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f3f5fb;
            color: #1f2937;
        }

        /* Navbar */
        nav {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        nav h2 {
            font-size: 26px;
            font-weight: 700;
        }

        nav div {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ddd6fe;
        }

        /* Dashboard */
        .dashboard-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .welcome-section {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 40px;
            border-radius: 18px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px rgba(79,70,229,0.2);
        }

        .welcome-section h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .welcome-section h3 {
            font-size: 21px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .welcome-section p {
            color: #ede9fe;
            font-size: 15px;
        }

        /* Applications Card */
        .dashboard-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
        }

        .dashboard-card h2 {
            color: #3730a3;
            font-size: 23px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eef2ff;
        }

        #applications {
            color: #4b5563;
            line-height: 1.7;
        }

        /* Responsive */
        @media (max-width: 600px) {
            nav {
                padding: 15px 5%;
                flex-direction: column;
                gap: 15px;
            }

            nav div {
                gap: 18px;
            }

            .dashboard-container {
                margin: 25px auto;
                padding: 15px;
            }

            .welcome-section {
                padding: 25px;
            }

            .welcome-section h1 {
                font-size: 26px;
            }

            .dashboard-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h2>JobPortal</h2>

        <div>
            <a href="/">Home</a>
            <a href="/jobs/">Jobs</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="dashboard-container">

        <div class="welcome-section">
            <h1>Student Dashboard</h1>

            <h3>
                Welcome, <span id="username"></span>!
            </h3>

            <p>
                Track your job applications and take the next step
                towards your dream career.
            </p>
        </div>

        <!-- Applications -->
        <div class="dashboard-card">

            <h2>My Applications</h2>

            <div id="applications">
                Loading applications...
            </div>

        </div>

    </div>

    <script src="/static/js/student-dashboard.js"></script>

</body>
</html>
