
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recruiter Dashboard - JobPortal</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f3f5fb;
            color: #1e293b;
        }

        /* Navbar */
        nav {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }

        nav h2 {
            color: #4f46e5;
            font-size: 27px;
            font-weight: 800;
        }

        nav div {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #4f46e5;
        }

        /* Dashboard */
        .dashboard-container {
            max-width: 1200px;
            margin: 45px auto;
            padding: 0 25px;
        }

        /* Welcome Section */
        .welcome-section {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 38px;
            border-radius: 18px;
            margin-bottom: 35px;
            box-shadow: 0 10px 25px rgba(79,70,229,0.2);
        }

        .welcome-section h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .welcome-section h3 {
            font-size: 19px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .welcome-section p {
            color: #e0e7ff;
            font-size: 15px;
        }

        #username {
            font-weight: 800;
            color: #fef08a;
        }

        /* Dashboard Heading */
        .section-heading {
            margin-bottom: 20px;
        }

        .section-heading h2 {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .section-heading p {
            color: #64748b;
            font-size: 14px;
        }

        /* Applications Card */
        .dashboard-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.05);
            border: 1px solid #eef0f5;
        }

        .dashboard-card h2 {
            font-size: 21px;
            color: #334155;
            margin-bottom: 22px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        #applications {
            color: #64748b;
            font-size: 15px;
            line-height: 1.8;
        }

        /* Application items generated by JavaScript */
        #applications > div {
            background: #f8faff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        #applications > div:hover {
            border-color: #818cf8;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 650px) {
            nav {
                flex-direction: column;
                gap: 18px;
            }

            nav div {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .welcome-section {
                padding: 25px;
            }

            .welcome-section h1 {
                font-size: 25px;
            }

            .dashboard-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>JobPortal</h2>

        <div>
            <a href="/">Home</a>
            <a href="/post-job/">Post Job</a>
            <a href="/my-jobs/">My Jobs</a>
            <a href="#" onclick="logout()">Logout</a>
            <a href="/post-job/">PostJob</a>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="dashboard-container">

        <!-- Welcome Section -->
        <div class="welcome-section">

            <h1>Recruiter Dashboard 👋</h1>

            <h3>
                Welcome, <span id="username"></span>!
            </h3>

            <p>
                Manage your job postings and track applications
                received from talented candidates.
            </p>

        </div>

        <!-- Applications Section -->
        <div class="section-heading">
            <h2>📋 Manage Applications</h2>
            <p>View and manage candidates who applied for your jobs.</p>
        </div>

        <div class="dashboard-card">

            <h2>📨 Received Applications</h2>

            <div id="applications">
                Loading applications...
            </div>

        </div>

    </div>

    <script src="/static/js/recruiter-dashboard.js"></script>

</body>
</html>
